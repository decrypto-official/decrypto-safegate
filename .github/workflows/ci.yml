name: CI

# Runs once per commit: on push to main, on pull requests, and by hand.
# Pushing to a branch that is also a PR used to start two runs for one
# commit, and the cancelled one showed on the PR as a failure.
# Everything here is offline: no public RPC endpoint is touched, so a bad
# minute on a node cannot block a merge. Live reads run nightly in live.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The contribution rules in CONTRIBUTING.md, enforced by a machine.
      - name: Validate patterns and registry
        run: npm run validate

      # DISCLOSURE.md is generated from the registry. A stale copy fails here.
      - name: Check disclosure is current
        run: npm run disclosure:check

      # Offline suite. Live regression locks are gated behind SAFEGATE_LIVE=1
      # and run in live.yml.
      - name: Test
        run: npm test

      - name: Install web deps
        run: npm ci
        working-directory: apps/web

      # `next build` succeeding is not enough: the engine reads patterns/ and
      # registry/ from disk at request time. The build script runs verify-trace,
      # which fails if that data is missing from the traced output.
      - name: Build web and verify bundled data
        run: npm run build
        working-directory: apps/web
